
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The J.E.T.I. Vision | Virtual Hair Try-On</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  background: #080808;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: "Segoe UI", Arial, sans-serif;
  color: white;
  padding: 12px;
}

.box {
  position: relative;
  width: min(100%, 390px);
  height: min(720px, calc(100dvh - 24px));
  min-height: 420px;
  background: #111;
  overflow: hidden;
  border-radius: 24px;
  border: 1px solid #604957;
}

video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transform: scaleX(-1);
  display: block;
}

.brand {
  position: absolute;
  top: 18px;
  left: 20px;
  font-size: 15px;
  letter-spacing: 2px;
  font-weight: 600;
  z-index: 40;
  text-shadow: 0 2px 6px black;
}

#hair {
  position: absolute;
  display: none;
  width: 220px;
  height: auto;
  max-width: none;
  pointer-events: none;
  z-index: 50;
  transform: translate(-50%, -50%);
  transform-origin: center center;
}

.controls {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  padding: 18px 12px;
  padding-bottom: max(18px, env(safe-area-inset-bottom));
  background: linear-gradient(
    transparent,
    rgba(0,0,0,.92) 25%
  );
  display: flex;
  flex-direction: column;
  gap: 10px;
  z-index: 90;
}

.row {
  display: flex;
  gap: 7px;
  justify-content: center;
  width: 100%;
}

button {
  flex: 1;
  min-width: 0;
  padding: 11px 7px;
  border-radius: 22px;
  border: none;
  background: #f5e5ec;
  color: #21151b;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
}

button:active {
  background: #dba9c0;
}

.adjustments {
  background: rgba(20,20,20,.8);
  padding: 10px;
  border-radius: 12px;
  display: none;
}

.adjustments label {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  margin: 7px 0 3px;
}

.adjustments input {
  width: 100%;
  accent-color: #dba9c0;
}

#status {
  font-size: 11px;
  text-align: center;
  color: #eee;
  min-height: 14px;
}

#startScreen {
  position: absolute;
  inset: 0;
  background: #090909;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 200;
  text-align: center;
  padding: 25px;
}

.startTitle {
  font-size: 32px;
  letter-spacing: 5px;
  font-weight: 600;
}

.startSub {
  margin-top: 14px;
  opacity: .8;
  font-size: 14px;
}

#startButton {
  flex: none;
  margin-top: 28px;
  padding: 13px 30px;
  font-size: 14px;
}

</style>
</head>

<body>

<div class="box" id="box">

  <div id="startScreen">
    <div class="startTitle">J.E.T.I.</div>
    <div class="startSub">
      The Future of Hair Starts Here
    </div>
    <button id="startButton" type="button">
      Touch to Begin
    </button>
  </div>

  <div class="brand">J.E.T.I. VISION</div>

  <video
    id="video"
    autoplay
    muted
    playsinline>
  </video>

  <img id="hair" alt="Virtual hairstyle">

  <div class="controls">

    <div class="row">
      <button id="btnA">Style A</button>
      <button id="btnB">Style B</button>
      <button id="btnClear">Clear</button>
    </div>

    <div class="adjustments" id="adjustments">

      <label>
        Hair Size
        <span id="sizeValue">100%</span>
      </label>
      <input
        id="sizeSlider"
        type="range"
        min="30"
        max="250"
        value="100">

      <label>
        Move Up / Down
        <span id="yValue">0</span>
      </label>
      <input
        id="ySlider"
        type="range"
        min="-200"
        max="200"
        value="0">

      <label>
        Move Left / Right
        <span id="xValue">0</span>
      </label>
      <input
        id="xSlider"
        type="range"
        min="-200"
        max="200"
        value="0">

    </div>

    <div class="row">
      <button id="btnFull">Fullscreen</button>
      <button id="btnReset">Reset</button>
    </div>

    <div id="status"></div>

  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>

<script>

const HAIR_A = "./style-a.png";
const HAIR_B = "./style-b.png";

const box = document.getElementById("box");
const video = document.getElementById("video");
const hair = document.getElementById("hair");

const startScreen = document.getElementById("startScreen");
const startButton = document.getElementById("startButton");

const adjustments = document.getElementById("adjustments");

const sizeSlider = document.getElementById("sizeSlider");
const xSlider = document.getElementById("xSlider");
const ySlider = document.getElementById("ySlider");

const status = document.getElementById("status");

let currentStyle = null;
let camera = null;
let cameraStarted = false;
let tracking = false;

let faceX = 0.5;
let faceY = 0.3;
let faceWidth = 0.35;

const settings = {
  a: { size: 100, x: 0, y: 0 },
  b: { size: 100, x: 0, y: 0 }
};

function updateLabels() {
  document.getElementById("sizeValue").textContent =
    sizeSlider.value + "%";

  document.getElementById("xValue").textContent =
    xSlider.value;

  document.getElementById("yValue").textContent =
    ySlider.value;
}

function updateSettings() {
  if (!currentStyle) return;

  settings[currentStyle] = {
    size: Number(sizeSlider.value),
    x: Number(xSlider.value),
    y: Number(ySlider.value)
  };

  updateLabels();
  positionHair();
}

function setStyle(key) {
  currentStyle = key;

  hair.src = key === "a" ? HAIR_A : HAIR_B;
  hair.style.display = "block";

  adjustments.style.display = "block";

  const s = settings[key];

  sizeSlider.value = s.size;
  xSlider.value = s.x;
  ySlider.value = s.y;

  updateLabels();
  positionHair();
}

function positionHair() {
  if (!currentStyle) return;

  const s = settings[currentStyle];

  const boxWidth = box.clientWidth;
  const boxHeight = box.clientHeight;

  // Convert the tracked camera position into
  // the displayed, cropped and mirrored video.
  const videoWidth = video.videoWidth || 640;
  const videoHeight = video.videoHeight || 480;

  const scale = Math.max(
    boxWidth / videoWidth,
    boxHeight / videoHeight
  );

  const displayedWidth = videoWidth * scale;
  const displayedHeight = videoHeight * scale;

  const cropX = (displayedWidth - boxWidth) / 2;
  const cropY = (displayedHeight - boxHeight) / 2;

  const px = faceX * displayedWidth - cropX;
  const py = faceY * displayedHeight - cropY;

  const facePixels = faceWidth * displayedWidth;

  // Initial hair size relative to face width.
  const hairWidth =
    facePixels * 1.8 * (s.size / 100);

  hair.style.width = hairWidth + "px";

  hair.style.left =
    (px + s.x) + "px";

  hair.style.top =
    (py + s.y) + "px";

  hair.style.transform =
    "translate(-50%, -50%)";
}

sizeSlider.addEventListener("input", updateSettings);
xSlider.addEventListener("input", updateSettings);
ySlider.addEventListener("input", updateSettings);

document.getElementById("btnA").onclick =
  () => setStyle("a");

document.getElementById("btnB").onclick =
  () => setStyle("b");

document.getElementById("btnClear").onclick = () => {
  currentStyle = null;
  hair.style.display = "none";
  adjustments.style.display = "none";
};

document.getElementById("btnReset").onclick = () => {
  settings.a = { size: 100, x: 0, y: 0 };
  settings.b = { size: 100, x: 0, y: 0 };

  if (currentStyle) {
    setStyle(currentStyle);
  }
};

document.getElementById("btnFull").onclick =
  async () => {
    try {
      if (!document.fullscreenElement) {
        await box.requestFullscreen();
      } else {
        await document.exitFullscreen();
      }
      positionHair();
    } catch (error) {
      status.textContent =
        "Fullscreen is not available.";
    }
  };

const mesh = new FaceMesh({
  locateFile: file =>
    "https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/" + file
});

mesh.setOptions({
  maxNumFaces: 1,
  refineLandmarks: false,
  minDetectionConfidence: 0.6,
  minTrackingConfidence: 0.6
});

mesh.onResults(results => {

  if (!results.multiFaceLandmarks ||
      !results.multiFaceLandmarks.length) {
    tracking = false;
    return;
  }

  tracking = true;

  const points = results.multiFaceLandmarks[0];

  // Forehead landmark.
  const forehead = points[10];

  // Side landmarks approximate face width.
  const leftSide = points[234];
  const rightSide = points[454];

  if (!forehead || !leftSide || !rightSide) return;

  // Mirror the tracking coordinates to match
  // the mirrored camera display.
  const targetX = 1 - forehead.x;
  const targetY = forehead.y;

  const targetWidth =
    Math.abs(rightSide.x - leftSide.x);

  faceX = faceX * 0.65 + targetX * 0.35;
  faceY = faceY * 0.65 + targetY * 0.35;

  faceWidth =
    faceWidth * 0.65 + targetWidth * 0.35;

  positionHair();
});

async function startCamera() {
  if (cameraStarted) return;

  startButton.disabled = true;
  startButton.textContent = "Starting...";

  try {
    if (!navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia) {
      throw new Error("Camera not supported");
    }

    camera = new Camera(video, {
      onFrame: async () => {
        await mesh.send({ image: video });
      },
      width: 640,
      height: 480
    });

    await camera.start();

    cameraStarted = true;
    startScreen.style.display = "none";

    status.textContent =
      "Choose a hairstyle to begin.";

  } catch (error) {
    startButton.disabled = false;
    startButton.textContent = "Try Again";

    status.textContent = "Camera unavailable.";

    alert(
      "Unable to start camera. Please allow camera access."
    );

    console.error(error);
  }
}

startButton.addEventListener("click", startCamera);

window.addEventListener("resize", positionHair);

</script>

</body>
</html>
