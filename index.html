
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>J.E.T.I. Vision | Smart Hair Try-On</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  padding: 10px;
  background: #080808;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: "Segoe UI", Arial, sans-serif;
  color: white;
}

.box {
  position: relative;
  width: min(100%, 390px);
  height: min(720px, calc(100dvh - 20px));
  min-height: 420px;
  overflow: hidden;
  border-radius: 24px;
  background: #111;
  border: 1px solid #634653;
}

video {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  transform: scaleX(-1);
}

.brand {
  position: absolute;
  top: 18px;
  left: 18px;
  z-index: 40;
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 2px;
  text-shadow: 0 2px 6px black;
}

#hair {
  position: absolute;
  display: none;
  width: 200px;
  height: auto;
  max-width: none;
  pointer-events: none;
  transform-origin: 50% 50%;
  z-index: 50;
}

.controls {
  position: absolute;
  left: 0;
  bottom: 0;
  width: 100%;
  padding: 14px 12px;
  padding-bottom: max(14px, env(safe-area-inset-bottom));
  background: linear-gradient(
    transparent,
    rgba(0,0,0,.96) 18%
  );
  z-index: 90;
  display: flex;
  flex-direction: column;
  gap: 9px;
}

.row {
  display: flex;
  gap: 7px;
}

button {
  flex: 1;
  min-width: 0;
  padding: 11px 6px;
  border: 0;
  border-radius: 22px;
  background: #f5e4ec;
  color: #241820;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
}

button.active {
  background: #dba3be;
}

.adjustments {
  display: none;
  padding: 10px;
  background: rgba(20,20,20,.86);
  border-radius: 13px;
}

.adjustments label {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  margin: 7px 0 4px;
}

.adjustments input {
  width: 100%;
  accent-color: #dfa9c4;
}

#status {
  text-align: center;
  font-size: 11px;
  color: #eee;
  min-height: 14px;
}

#startScreen {
  position: absolute;
  inset: 0;
  z-index: 200;
  background: #080808;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 25px;
}

.startTitle {
  font-size: 36px;
  letter-spacing: 6px;
  font-weight: 600;
}

.startSub {
  margin-top: 15px;
  font-size: 14px;
  opacity: .8;
}

#startButton {
  flex: none;
  margin-top: 28px;
  padding: 13px 28px;
  font-size: 14px;
}
</style>
</head>

<body>

<div class="box" id="box">

  <div id="startScreen">
    <div class="startTitle">J.E.T.I.</div>
    <div class="startSub">
      The Future of Hair Starts Here
    </div>
    <button id="startButton">
      Touch to Begin
    </button>
  </div>

  <div class="brand">J.E.T.I. VISION</div>

  <video id="video" autoplay muted playsinline></video>

  <img id="hair" alt="Virtual hairstyle">

  <div class="controls">

    <div class="row">
      <button id="btnA">Style A</button>
      <button id="btnB">Style B</button>
      <button id="btnClear">Clear</button>
    </div>

    <div class="row">
      <button id="btnAuto">Auto Fit</button>
      <button id="btnResetFit">Reset Fit</button>
    </div>

    <div class="adjustments" id="adjustments">

      <label>
        Hair Size
        <span id="sizeValue">100%</span>
      </label>
      <input id="sizeSlider"
        type="range"
        min="40"
        max="180"
        value="100">

      <label>
        Move Up / Down
        <span id="yValue">0</span>
      </label>
      <input id="ySlider"
        type="range"
        min="-200"
        max="200"
        value="0">

      <label>
        Move Left / Right
        <span id="xValue">0</span>
      </label>
      <input id="xSlider"
        type="range"
        min="-200"
        max="200"
        value="0">

    </div>

    <div class="row">
      <button id="btnFull">Fullscreen</button>
      <button id="btnReset">Reset</button>
    </div>

    <div id="status">
      Ready to begin
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>

<script>
"use strict";

const HAIR_A = "./style-a.png";
const HAIR_B = "./style-b.png";

const box = document.getElementById("box");
const video = document.getElementById("video");
const hair = document.getElementById("hair");
const status = document.getElementById("status");

const startScreen = document.getElementById("startScreen");
const startButton = document.getElementById("startButton");

const adjustments = document.getElementById("adjustments");

const sizeSlider = document.getElementById("sizeSlider");
const xSlider = document.getElementById("xSlider");
const ySlider = document.getElementById("ySlider");

const btnAuto = document.getElementById("btnAuto");

let currentStyle = null;
let camera = null;
let cameraStarted = false;
let autoFit = true;

let face = null;

const settings = {
  a: { size: 100, x: 0, y: 0 },
  b: { size: 100, x: 0, y: 0 }
};

// Adjust these if the source hairstyles
// have different proportions.
const styleConfig = {
  a: {
    widthMultiplier: 1.8,
    hairlineOffset: -0.08
  },
  b: {
    widthMultiplier: 1.8,
    hairlineOffset: -0.08
  }
};

function smooth(previous, next, amount = 0.3) {
  return previous + (next - previous) * amount;
}

function updateLabels() {
  document.getElementById("sizeValue").textContent =
    sizeSlider.value + "%";

  document.getElementById("xValue").textContent =
    xSlider.value;

  document.getElementById("yValue").textContent =
    ySlider.value;
}

function setSliders(key) {
  const s = settings[key];

  sizeSlider.value = s.size;
  xSlider.value = s.x;
  ySlider.value = s.y;

  updateLabels();
}

function updateSettings() {
  if (!currentStyle) return;

  settings[currentStyle] = {
    size: Number(sizeSlider.value),
    x: Number(xSlider.value),
    y: Number(ySlider.value)
  };

  updateLabels();
  positionHair();
}

function setStyle(key) {
  currentStyle = key;

  hair.src = key === "a" ? HAIR_A : HAIR_B;

  hair.style.display = "block";
  adjustments.style.display = "block";

  setSliders(key);
  positionHair();

  status.textContent =
    "Tracking hairstyle. Adjust fit if needed.";
}

function videoCoordinates(point) {
  const boxWidth = box.clientWidth;
  const boxHeight = box.clientHeight;

  const videoWidth = video.videoWidth || 640;
  const videoHeight = video.videoHeight || 480;

  const scale = Math.max(
    boxWidth / videoWidth,
    boxHeight / videoHeight
  );

  const renderedWidth = videoWidth * scale;
  const renderedHeight = videoHeight * scale;

  const cropX = (renderedWidth - boxWidth) / 2;
  const cropY = (renderedHeight - boxHeight) / 2;

  return {
    x: (1 - point.x) * renderedWidth - cropX,
    y: point.y * renderedHeight - cropY
  };
}

function positionHair() {
  if (!currentStyle || !face) return;

  const s = settings[currentStyle];
  const config = styleConfig[currentStyle];

  const forehead = videoCoordinates(face.forehead);
  const leftSide = videoCoordinates(face.leftSide);
  const rightSide = videoCoordinates(face.rightSide);

  const leftEye = videoCoordinates(face.leftEye);
  const rightEye = videoCoordinates(face.rightEye);

  const faceWidth = Math.hypot(
    rightSide.x - leftSide.x,
    rightSide.y - leftSide.y
  );

  const eyeAngle = Math.atan2(
    rightEye.y - leftEye.y,
    rightEye.x - leftEye.x
  );

  const sizeFactor = autoFit ? 1 : 0.95;

  const hairWidth =
    faceWidth *
    config.widthMultiplier *
    (s.size / 100) *
    sizeFactor;

  const x =
    forehead.x + s.x;

  const y =
    forehead.y +
    faceWidth * config.hairlineOffset +
    s.y;

  hair.style.width = hairWidth + "px";
  hair.style.left = x + "px";
  hair.style.top = y + "px";

  // Position image top near forehead.
  // Rotate slightly with head tilt.
  hair.style.transform =
    "translate(-50%, -8%) rotate(" +
    eyeAngle + "rad)";
}

sizeSlider.addEventListener("input", updateSettings);
xSlider.addEventListener("input", updateSettings);
ySlider.addEventListener("input", updateSettings);

document.getElementById("btnA").onclick =
  () => setStyle("a");

document.getElementById("btnB").onclick =
  () => setStyle("b");

document.getElementById("btnClear").onclick = () => {
  currentStyle = null;
  hair.style.display = "none";
  adjustments.style.display = "none";
  status.textContent = "Hairstyle cleared.";
};

btnAuto.onclick = () => {
  autoFit = !autoFit;
  btnAuto.classList.toggle("active", autoFit);

  status.textContent = autoFit
    ? "Automatic fitting enabled."
    : "Manual fitting enabled.";

  positionHair();
};

btnAuto.classList.add("active");

document.getElementById("btnResetFit").onclick = () => {
  if (!currentStyle) return;

  settings[currentStyle] = {
    size: 100,
    x: 0,
    y: 0
  };

  autoFit = true;
  btnAuto.classList.add("active");

  setSliders(currentStyle);
  positionHair();

  status.textContent = "Fit reset.";
};

document.getElementById("btnReset").onclick = () => {
  location.reload();
};

document.getElementById("btnFull").onclick =
  async () => {
    try {
      if (!document.fullscreenElement) {
        await box.requestFullscreen();
      } else {
        await document.exitFullscreen();
      }
      positionHair();
    } catch (error) {
      status.textContent =
        "Fullscreen is not available.";
    }
  };

const mesh = new FaceMesh({
  locateFile: file =>
    "https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/" + file
});

mesh.setOptions({
  maxNumFaces: 1,
  refineLandmarks: false,
  minDetectionConfidence: 0.6,
  minTrackingConfidence: 0.6
});

mesh.onResults(results => {
  if (!results.multiFaceLandmarks?.length) {
    face = null;
    hair.style.visibility = "hidden";
    return;
  }

  const landmarks = results.multiFaceLandmarks[0];

  const nextFace = {
    forehead: landmarks[10],
    leftSide: landmarks[234],
    rightSide: landmarks[454],
    leftEye: landmarks[33],
    rightEye: landmarks[263]
  };

  if (!face) {
    face = nextFace;
  } else {
    for (const key of Object.keys(nextFace)) {
      face[key] = {
        x: smooth(face[key].x, nextFace[key].x),
        y: smooth(face[key].y, nextFace[key].y)
      };
    }
  }

  hair.style.visibility = "visible";
  positionHair();
});

async function startCamera() {
  if (cameraStarted) return;

  startButton.disabled = true;
  startButton.textContent = "Starting...";

  try {
    camera = new Camera(video, {
      onFrame: async () => {
        await mesh.send({ image: video });
      },
      width: 640,
      height: 480
    });

    await camera.start();

    cameraStarted = true;
    startScreen.style.display = "none";
    status.textContent = "Choose a hairstyle.";

  } catch (error) {
    console.error(error);
    startButton.disabled = false;
    startButton.textContent = "Try Again";
    status.textContent = "Camera unavailable.";
    alert("Please allow camera access and try again.");
  }
}

startButton.addEventListener("click", startCamera);

window.addEventListener("resize", positionHair);

</script>
</body>
</html>
