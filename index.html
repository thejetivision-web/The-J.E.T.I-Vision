<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>J.E.T.I. Vision | Smart Auto Fit</title>

<style>
*{box-sizing:border-box}
:root{
  --pink:#dba3be;
  --pale:#f5e4ec;
  --dark:#101010;
}
body{
  margin:0;
  background:#080808;
  color:white;
  font-family:Arial,sans-serif;
}
.app{
  width:min(100%,480px);
  margin:auto;
  padding:12px 12px 30px;
}
.mirror{
  position:relative;
  width:100%;
  aspect-ratio:3/4;
  overflow:hidden;
  background:#181818;
  border:1px solid #684a5a;
  border-radius:22px;
  isolation:isolate;
}
video{
  width:100%;
  height:100%;
  object-fit:cover;
  transform:scaleX(-1);
  display:block;
}
#hair{
  position:absolute;
  display:none;
  max-width:none;
  height:auto;
  pointer-events:none;
  transform-origin:center;
  z-index:5;
}
.brand{
  position:absolute;
  top:14px;
  left:14px;
  z-index:10;
  letter-spacing:2px;
  font-weight:bold;
  font-size:13px;
  text-shadow:0 2px 6px black;
}
.start{
  position:absolute;
  inset:0;
  z-index:20;
  background:#101010;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:20px;
  text-align:center;
  padding:20px;
}
.start h1{
  letter-spacing:6px;
  font-size:34px;
  margin:0;
}
.start p{
  font-size:13px;
  color:#ddd;
  margin:0;
}
button{
  border:0;
  background:var(--pale);
  color:#261923;
  font-weight:bold;
  cursor:pointer;
  border-radius:22px;
  padding:12px 8px;
  font-size:12px;
}
button.active{
  background:var(--pink);
}
button:disabled{
  opacity:.5;
  cursor:not-allowed;
}
.start button{
  padding:14px 30px;
  background:var(--pink);
}
.panel{
  margin-top:14px;
  background:#171417;
  border:1px solid #322630;
  border-radius:20px;
  padding:14px;
}
.heading{
  color:#c7b8c1;
  font-size:11px;
  letter-spacing:2px;
  margin-bottom:12px;
}
.buttons{
  display:flex;
  gap:8px;
  margin-bottom:9px;
}
.buttons button{
  flex:1;
  min-width:0;
}
.toggle{
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#30222b;
  color:white;
  border:1px solid #775267;
  border-radius:12px;
  margin-top:6px;
  padding:13px;
}
.adjustments{
  display:none;
  background:#211b20;
  border-radius:13px;
  margin-top:12px;
  padding:14px;
}
.adjustments.open{
  display:block;
}
.slider{
  margin-bottom:16px;
}
.slider label{
  display:flex;
  justify-content:space-between;
  margin-bottom:8px;
  font-size:12px;
}
.slider input{
  width:100%;
  accent-color:var(--pink);
}
.status{
  text-align:center;
  color:#cfc2ca;
  font-size:12px;
  padding:12px 2px 0;
  min-height:30px;
}
.footer{
  text-align:center;
  color:#9e8b97;
  font-size:11px;
  letter-spacing:2px;
  padding-top:20px;
}
.mirror:fullscreen{
  width:100vw;
  height:100dvh;
  aspect-ratio:auto;
  border:0;
  border-radius:0;
}
@media(min-width:700px){
  .app{width:min(100%,560px)}
  .mirror{aspect-ratio:4/5}
}
</style>
</head>

<body>
<main class="app">

  <div class="mirror" id="mirror">
    <video id="video" autoplay muted playsinline></video>
    <img id="hair" alt="Virtual hairstyle">
    <div class="brand">J.E.T.I. VISION</div>

    <div class="start" id="startScreen">
      <h1>J.E.T.I.</h1>
      <p>The Future of Hair Starts Here</p>
      <button id="startButton">Touch to Begin</button>
    </div>
  </div>

  <section class="panel">
    <div class="heading">EXPLORE YOUR LOOK</div>

<div class="buttons">
  <button id="btnA">Blonde Waves</button>
  <button id="btnB">Goddess Braids</button>
  <button id="btnC">Pixie Cut</button>
  <button id="btnClear">Clear</button>
</div>


    <div class="buttons">
      <button id="btnAuto" class="active">Auto Fit</button>
      <button id="btnFull">Fullscreen</button>
      <button id="btnReset">Reset</button>
    </div>

    <button id="btnAdjust"
            class="toggle"
            aria-expanded="false"
            aria-controls="adjustments"
            disabled>
      <span>Adjust Hair</span>
      <span id="arrow">+</span>
    </button>

    <div class="adjustments" id="adjustments">

      <div class="slider">
        <label for="sizeSlider">
          Hair Size <span id="sizeValue">100%</span>
        </label>
        <input id="sizeSlider" type="range"
               min="40" max="200" value="100">
      </div>

      <div class="slider">
        <label for="widthSlider">
          Hair Width <span id="widthValue">100%</span>
        </label>
        <input id="widthSlider" type="range"
               min="70" max="180" value="100">
      </div>

      <div class="slider">
        <label for="ySlider">
          Move Up / Down <span id="yValue">0</span>
        </label>
        <input id="ySlider" type="range"
               min="-200" max="200" value="0">
      </div>

      <div class="slider">
        <label for="xSlider">
          Move Left / Right <span id="xValue">0</span>
        </label>
        <input id="xSlider" type="range"
               min="-200" max="200" value="0">
      </div>

      <div class="buttons">
        <button id="btnResetFit">Reset Hair Fit</button>
      </div>

    </div>

    <div class="status" id="status">
      Ready to begin
    </div>
  </section>

  <div class="footer">THE J.E.T.I. VISION</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>

<script>
"use strict";

// ========================================
// J.E.T.I. VISION V3.1
// SMART LANDMARK-BASED AUTO FIT
// ========================================

const $ = id => document.getElementById(id);

const mirror = $("mirror");
const video = $("video");
const hair = $("hair");
const statusText = $("status");

const sizeSlider = $("sizeSlider");
const widthSlider = $("widthSlider");
const xSlider = $("xSlider");
const ySlider = $("ySlider");

const btnA = $("btnA");
const btnB = $("btnB");
const btnC = $("btnC");
const btnAuto = $("btnAuto");
const btnAdjust = $("btnAdjust");


let currentStyle = null;
let camera = null;
let cameraStarted = false;
let cameraStarting = false;
let face = null;

// Auto Fit starts ON.
// Manual adjustments can be applied afterward.
let autoFit = true;

// Your successful settings are the
// starting calibration for Style A.
//
// REFERENCE_FACE_WIDTH is an estimate.
// It can be fine-tuned after camera testing.

const REFERENCE_FACE_WIDTH = 150;

const presets = {
  a: {
    image: "./style-a.png",
    size: 157,
    width: 152,
    x: -4,
    y: -37,
    widthMultiplier: 1.8,
    hairlineOffset: -0.08
  },
b: {
    image: "./style-b.png",
    size: 96,
    width: 128,
    x: 0,
    y: -11,
    widthMultiplier: 1.8,
    hairlineOffset: -0.08
  },
  c: {
    image: "./style-c.png",
    size: 90,
    width: 94,
    x: -4,
    y: -65,
    widthMultiplier: 1.8,
    hairlineOffset: -0.08
  }
};

// Slider settings are saved separately
// for each hairstyle.

const settings = {
  a: {
    size: presets.a.size,
    width: presets.a.width,
    x: presets.a.x,
    y: presets.a.y
  },
  b: {
    size: presets.b.size,
    width: presets.b.width,
    x: presets.b.x,
    y: presets.b.y
  },
  c: {
    size: presets.c.size,
    width: presets.c.width,
    x: presets.c.x,
    y: presets.c.y
  }
};

// ========================================
// DISPLAY HELPERS
// ========================================

function updateLabels() {
  $("sizeValue").textContent =
    sizeSlider.value + "%";

  $("widthValue").textContent =
    widthSlider.value + "%";

  $("xValue").textContent = xSlider.value;
  $("yValue").textContent = ySlider.value;
}

function loadSliders(key) {
  const s = settings[key];

  sizeSlider.value = s.size;
  widthSlider.value = s.width;
  xSlider.value = s.x;
  ySlider.value = s.y;

  updateLabels();
}

function saveSliders() {
  if (!currentStyle) return;

  settings[currentStyle] = {
    size: Number(sizeSlider.value),
    width: Number(widthSlider.value),
    x: Number(xSlider.value),
    y: Number(ySlider.value)
  };

  // Sliders become fine-tuning controls.
  autoFit = false;
  btnAuto.classList.remove("active");

  updateLabels();
  positionHair();

  statusText.textContent =
    "Custom fit active. Tracking continues.";
}

function toggleAdjustments(open) {
  $("adjustments").classList.toggle("open", open);
  btnAdjust.setAttribute(
    "aria-expanded",
    String(open)
  );
  $("arrow").textContent = open ? "−" : "+";
}

// ========================================
// STYLE SELECTION
// ========================================

function selectStyle(key) {
  currentStyle = key;

  hair.src = presets[key].image;
  hair.style.display = "block";
  hair.style.visibility = face ? "visible" : "hidden";

  btnAdjust.disabled = false;

  btnA.classList.toggle("active", key === "a");
  btnB.classList.toggle("active", key === "b");

  loadSliders(key);
  positionHair();

  statusText.textContent = autoFit
    ? "Smart Auto Fit tracking your face."
    : "Custom fit tracking your face.";
}

function clearStyle() {
  currentStyle = null;
  hair.style.display = "none";

  btnA.classList.remove("active");
  btnB.classList.remove("active");

  btnAdjust.disabled = true;
  toggleAdjustments(false);

  statusText.textContent = "Hairstyle cleared.";
}

// ========================================
// FACE LANDMARK COORDINATES
// ========================================

// Match MediaPipe coordinates to the
// mirrored, cropped camera display.

function videoCoordinates(point) {
  const mw = mirror.clientWidth;
  const mh = mirror.clientHeight;

  const vw = video.videoWidth || 640;
  const vh = video.videoHeight || 480;

  const scale = Math.max(mw / vw, mh / vh);

  const rw = vw * scale;
  const rh = vh * scale;

  const cropX = (rw - mw) / 2;
  const cropY = (rh - mh) / 2;

  return {
    x: (1 - point.x) * rw - cropX,
    y: point.y * rh - cropY
  };
}

// ========================================
// SAFE HEAD ROTATION
// ========================================

// Keep hair upright, including when
// mirrored eye positions reverse direction.

function headTilt(leftEye, rightEye) {
  const dx = rightEye.x - leftEye.x;
  const dy = rightEye.y - leftEye.y;

  let angle = Math.atan2(dy, dx);

  if (angle > Math.PI / 2) {
    angle -= Math.PI;
  }

  if (angle < -Math.PI / 2) {
    angle += Math.PI;
  }

  const limit = 25 * Math.PI / 180;

  return Math.max(-limit, Math.min(limit, angle));
}

// ========================================
// SMART HAIRSTYLE POSITIONING
// ========================================

function positionHair() {
  if (!currentStyle || !face) return;

  const preset = presets[currentStyle];
  const s = settings[currentStyle];

  const forehead = videoCoordinates(face.forehead);
  const leftTemple = videoCoordinates(face.leftTemple);
  const rightTemple = videoCoordinates(face.rightTemple);

  const leftEye = videoCoordinates(face.leftEye);
  const rightEye = videoCoordinates(face.rightEye);

  // Measure current face width.
  const faceWidth = Math.hypot(
    rightTemple.x - leftTemple.x,
    rightTemple.y - leftTemple.y
  );

  if (!Number.isFinite(faceWidth) || faceWidth < 10) {
    hair.style.visibility = "hidden";
    return;
  }

  // Scale reference offsets to the face.
  // This replaces fixed pixel offsets.
  const faceScale =
    faceWidth / REFERENCE_FACE_WIDTH;

  const values = autoFit ? preset : s;

  // Hairstyle width follows face size.
  const hairWidth =
    faceWidth *
    preset.widthMultiplier *
    (values.size / 100);

  // Position offsets adapt to face width.
  const xOffset = values.x * faceScale;
  const yOffset = values.y * faceScale;

  const x = forehead.x + xOffset;

  const y =
    forehead.y +
    faceWidth * preset.hairlineOffset +
    yOffset;

  const angle = headTilt(leftEye, rightEye);
  const stretchX = values.width / 100;

  hair.style.width = hairWidth + "px";
  hair.style.left = x + "px";
  hair.style.top = y + "px";

  hair.style.transform =
    "translate(-50%, -8%) rotate(" +
    angle + "rad) scaleX(" +
    stretchX + ")";

  hair.style.visibility = "visible";
}

// ========================================
// CONTROLS
// ========================================

sizeSlider.addEventListener("input", saveSliders);
widthSlider.addEventListener("input", saveSliders);
xSlider.addEventListener("input", saveSliders);
ySlider.addEventListener("input", saveSliders);

btnA.onclick = () => selectStyle("a");
btnB.onclick = () => selectStyle("b");
btnC.onclick = () => selectStyle("c");
  
$("btnClear").onclick = clearStyle;

btnAdjust.onclick = () => {
  if (!currentStyle) return;

  const open =
    $("adjustments").classList.contains("open");

  toggleAdjustments(!open);
};

// Auto Fit restores the style's calibrated
// values, then continues tracking.

btnAuto.onclick = () => {
  autoFit = true;
  btnAuto.classList.add("active");

  if (currentStyle) {
    const p = presets[currentStyle];

    settings[currentStyle] = {
      size: p.size,
      width: p.width,
      x: p.x,
      y: p.y
    };

    loadSliders(currentStyle);
    positionHair();
  }

  statusText.textContent =
    "Smart Auto Fit enabled.";
};

$("btnResetFit").onclick = () => {
  if (!currentStyle) return;

  const p = presets[currentStyle];

  settings[currentStyle] = {
    size: p.size,
    width: p.width,
    x: p.x,
    y: p.y
  };

  autoFit = true;
  btnAuto.classList.add("active");

  loadSliders(currentStyle);
  positionHair();

  statusText.textContent =
    "Hair fit reset to calibration.";
};

$("btnReset").onclick = () => {
  location.reload();
};

$("btnFull").onclick = async () => {
  try {
    if (!document.fullscreenElement) {
      await mirror.requestFullscreen();
    } else {
      await document.exitFullscreen();
    }

    positionHair();
  } catch (error) {
    statusText.textContent =
      "Fullscreen is unavailable.";
  }
};

// ========================================
// MEDIAPIPE FACE TRACKING
// ========================================

function smoothPoint(oldPoint, newPoint) {
  const amount = 0.3;

  return {
    x: oldPoint.x +
       (newPoint.x - oldPoint.x) * amount,
    y: oldPoint.y +
       (newPoint.y - oldPoint.y) * amount
  };
}

const mesh = new FaceMesh({
  locateFile: file =>
    "https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/" +
    file
});

mesh.setOptions({
  maxNumFaces: 1,
  refineLandmarks: false,
  minDetectionConfidence: 0.6,
  minTrackingConfidence: 0.6
});

mesh.onResults(results => {
  const detected = results.multiFaceLandmarks;

  if (!detected || !detected.length) {
    face = null;
    hair.style.visibility = "hidden";
    return;
  }

  const lm = detected[0];

  const next = {
    forehead: lm[10],
    leftTemple: lm[234],
    rightTemple: lm[454],
    leftEye: lm[33],
    rightEye: lm[263]
  };

  if (!face) {
    face = next;
  } else {
    for (const key of Object.keys(next)) {
      face[key] = smoothPoint(face[key], next[key]);
    }
  }

  positionHair();
});

// ========================================
// CAMERA
// ========================================

async function startCamera() {
  if (cameraStarted || cameraStarting) return;

  cameraStarting = true;

  $("startButton").disabled = true;
  $("startButton").textContent = "Starting...";

  try {
    camera = new Camera(video, {
      onFrame: async () => {
        await mesh.send({ image: video });
      },
      width: 640,
      height: 480
    });

    await camera.start();

    cameraStarted = true;
    $("startScreen").style.display = "none";

    statusText.textContent =
      "Camera ready. Choose a hairstyle.";

  } catch (error) {
    console.error(error);

    $("startButton").disabled = false;
    $("startButton").textContent = "Try Again";

    statusText.textContent =
      "Camera unavailable. Check permissions.";

  } finally {
    cameraStarting = false;
  }
}

$("startButton").addEventListener(
  "click",
  startCamera
);

window.addEventListener("resize", positionHair);

document.addEventListener(
  "fullscreenchange",
  positionHair
);

updateLabels();

</script>
</body>
</html>
